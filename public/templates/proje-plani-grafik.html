<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proje Planı - Adam/Gün Karşılaştırması</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1e3a5f 0%, #2c5282 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    h1 {
      color: white;
      text-align: center;
      margin-bottom: 10px;
      font-size: 24px;
    }
    .subtitle {
      color: #a0c4e8;
      text-align: center;
      margin-bottom: 30px;
      font-size: 14px;
    }
    .chart-container {
      background: white;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    }
    .legend-container {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: #333;
    }
    .legend-color {
      width: 20px;
      height: 20px;
      border-radius: 4px;
    }
    .summary-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }
    .summary-card {
      background: #f8fafc;
      border-radius: 8px;
      padding: 15px;
      text-align: center;
      border-left: 4px solid;
    }
    .summary-card.consultant {
      border-color: #ef4444;
    }
    .summary-card.target {
      border-color: #3b82f6;
    }
    .summary-card.actual {
      border-color: #22c55e;
    }
    .summary-card h3 {
      font-size: 12px;
      color: #666;
      margin-bottom: 5px;
      text-transform: uppercase;
    }
    .summary-card .value {
      font-size: 28px;
      font-weight: bold;
      color: #1e3a5f;
    }
    .summary-card .unit {
      font-size: 12px;
      color: #888;
    }
    .progress-section {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid #e5e7eb;
    }
    .progress-section h2 {
      font-size: 16px;
      color: #333;
      margin-bottom: 15px;
    }
    .progress-item {
      margin-bottom: 15px;
    }
    .progress-label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 5px;
      font-size: 13px;
    }
    .progress-name {
      color: #333;
      font-weight: 500;
    }
    .progress-values {
      color: #666;
    }
    .progress-bar-container {
      height: 24px;
      background: #f1f5f9;
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }
    .progress-bar {
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      border-radius: 4px;
      opacity: 0.8;
    }
    .progress-bar.consultant {
      background: #ef4444;
      z-index: 1;
    }
    .progress-bar.target {
      background: #3b82f6;
      z-index: 2;
    }
    .progress-bar.actual {
      background: #22c55e;
      z-index: 3;
    }
    .efficiency {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: bold;
      margin-left: 5px;
    }
    .efficiency.good {
      background: #dcfce7;
      color: #166534;
    }
    .efficiency.warning {
      background: #fef3c7;
      color: #92400e;
    }
    .efficiency.bad {
      background: #fee2e2;
      color: #991b1b;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>IFS MODULLERI - Proje Planı</h1>
    <p class="subtitle">Adam/Gün Karşılaştırması: Danışman Hedef vs Bizim Hedef vs Gerçekleşen</p>

    <div class="chart-container">
      <div class="legend-container">
        <div class="legend-item">
          <div class="legend-color" style="background: #ef4444;"></div>
          <span>Danışman Hedef</span>
        </div>
        <div class="legend-item">
          <div class="legend-color" style="background: #3b82f6;"></div>
          <span>Bizim Hedef</span>
        </div>
        <div class="legend-item">
          <div class="legend-color" style="background: #22c55e;"></div>
          <span>Gerçekleşen</span>
        </div>
      </div>

      <canvas id="projectChart" height="400"></canvas>

      <div class="summary-cards">
        <div class="summary-card consultant">
          <h3>Danışman Toplam</h3>
          <div class="value" id="totalConsultant">-</div>
          <div class="unit">Adam/Gün</div>
        </div>
        <div class="summary-card target">
          <h3>Bizim Hedef Toplam</h3>
          <div class="value" id="totalTarget">-</div>
          <div class="unit">Adam/Gün</div>
        </div>
        <div class="summary-card actual">
          <h3>Gerçekleşen Toplam</h3>
          <div class="value" id="totalActual">-</div>
          <div class="unit">Adam/Gün</div>
        </div>
      </div>

      <div class="progress-section">
        <h2>Detaylı Karşılaştırma</h2>
        <div id="progressBars"></div>
      </div>
    </div>
  </div>

  <script>
    // Proje verileri - Bu kısmı kendi verilerinizle güncelleyin
    const projectData = [
      { name: 'Analiz Süreci', consultant: 34, target: 10, actual: 8 },
      { name: 'Dokümantasyon Hazırlığı & Teslimi', consultant: 6, target: 4, actual: 3 },
      { name: 'Eğitimlerin Verilmesi', consultant: 24, target: 15, actual: 12 },
      { name: 'Eğitim Kullanıcı Değerlendirmeleri', consultant: 24, target: 10, actual: 0 },
      { name: 'Çözüm Süreci', consultant: 90, target: 45, actual: 30 },
      { name: 'Modifikasyon Hazırlığı ve Onayı', consultant: 29, target: 15, actual: 10 },
      { name: 'Modifikasyon Uygulamaları', consultant: 95, target: 50, actual: 35 },
      { name: 'Modifikasyon Eğitimleri & Teslimi', consultant: 29, target: 15, actual: 0 },
      { name: 'Temel Veri Hazırlığı', consultant: 29, target: 20, actual: 15 },
      { name: 'Paralel Kullanım', consultant: 80, target: 40, actual: 0 },
      { name: 'Canlı Kullanım-Destek', consultant: 160, target: 80, actual: 0 },
    ];

    // Grafik oluştur
    const ctx = document.getElementById('projectChart').getContext('2d');

    const chart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: projectData.map(d => d.name),
        datasets: [
          {
            label: 'Danışman Hedef',
            data: projectData.map(d => d.consultant),
            backgroundColor: 'rgba(239, 68, 68, 0.8)',
            borderColor: 'rgba(239, 68, 68, 1)',
            borderWidth: 1
          },
          {
            label: 'Bizim Hedef',
            data: projectData.map(d => d.target),
            backgroundColor: 'rgba(59, 130, 246, 0.8)',
            borderColor: 'rgba(59, 130, 246, 1)',
            borderWidth: 1
          },
          {
            label: 'Gerçekleşen',
            data: projectData.map(d => d.actual),
            backgroundColor: 'rgba(34, 197, 94, 0.8)',
            borderColor: 'rgba(34, 197, 94, 1)',
            borderWidth: 1
          }
        ]
      },
      options: {
        indexAxis: 'y',
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            display: false
          },
          tooltip: {
            callbacks: {
              label: function(context) {
                return context.dataset.label + ': ' + context.raw + ' adam/gün';
              }
            }
          }
        },
        scales: {
          x: {
            beginAtZero: true,
            title: {
              display: true,
              text: 'Adam/Gün',
              font: { weight: 'bold' }
            },
            grid: {
              color: 'rgba(0,0,0,0.05)'
            }
          },
          y: {
            grid: {
              display: false
            },
            ticks: {
              font: { size: 11 }
            }
          }
        }
      }
    });

    // Toplamları hesapla
    const totalConsultant = projectData.reduce((sum, d) => sum + d.consultant, 0);
    const totalTarget = projectData.reduce((sum, d) => sum + d.target, 0);
    const totalActual = projectData.reduce((sum, d) => sum + d.actual, 0);

    document.getElementById('totalConsultant').textContent = totalConsultant;
    document.getElementById('totalTarget').textContent = totalTarget;
    document.getElementById('totalActual').textContent = totalActual;

    // Progress bar'ları oluştur
    const progressContainer = document.getElementById('progressBars');
    const maxValue = Math.max(...projectData.map(d => Math.max(d.consultant, d.target, d.actual)));

    projectData.forEach(item => {
      const consultantWidth = (item.consultant / maxValue) * 100;
      const targetWidth = (item.target / maxValue) * 100;
      const actualWidth = (item.actual / maxValue) * 100;

      // Verimlilik hesapla (hedefin yüzdesi olarak)
      let efficiency = '';
      let efficiencyClass = '';
      if (item.actual > 0) {
        const ratio = (item.actual / item.target) * 100;
        if (ratio <= 80) {
          efficiency = Math.round(ratio) + '% (Harika!)';
          efficiencyClass = 'good';
        } else if (ratio <= 100) {
          efficiency = Math.round(ratio) + '% (İyi)';
          efficiencyClass = 'good';
        } else if (ratio <= 120) {
          efficiency = Math.round(ratio) + '% (Dikkat)';
          efficiencyClass = 'warning';
        } else {
          efficiency = Math.round(ratio) + '% (Aşıldı)';
          efficiencyClass = 'bad';
        }
      }

      const progressItem = document.createElement('div');
      progressItem.className = 'progress-item';
      progressItem.innerHTML = `
        <div class="progress-label">
          <span class="progress-name">${item.name}</span>
          <span class="progress-values">
            <span style="color: #ef4444;">${item.consultant}</span> /
            <span style="color: #3b82f6;">${item.target}</span> /
            <span style="color: #22c55e;">${item.actual}</span>
            ${efficiency ? `<span class="efficiency ${efficiencyClass}">${efficiency}</span>` : ''}
          </span>
        </div>
        <div class="progress-bar-container">
          <div class="progress-bar consultant" style="width: ${consultantWidth}%;"></div>
          <div class="progress-bar target" style="width: ${targetWidth}%;"></div>
          <div class="progress-bar actual" style="width: ${actualWidth}%;"></div>
        </div>
      `;
      progressContainer.appendChild(progressItem);
    });
  </script>
</body>
</html>
